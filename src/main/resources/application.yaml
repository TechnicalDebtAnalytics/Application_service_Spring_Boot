server:
  port: ${PORT:8080}

spring:
  application:
    name: technical-debt-backend

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
    
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${AUTH0_DOMAIN:dev-8nsu386inyln7qfs.us.auth0.com}/
          audiences: ${AUTH0_AUDIENCE:https://dev-8nsu386inyln7qfs.us.auth0.com/api/v2/}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/neondb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

    hikari:
      max-lifetime: 300000
      keepalive-time: 120000
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: ${MAIL_HOST:smtp.gmail.com}

app:
  invitation:
    frontend-base-url: ${INVITATION_FRONTEND_URL:http://localhost:5173/invitation/accept}
    expiration-days: 7

auth0:
  domain: ${AUTH0_DOMAIN:dev-8nsu386inyln7qfs.us.auth0.com}
  client-id: ${AUTH0_CLIENT_ID:}
  client-secret: ${AUTH0_CLIENT_SECRET:}
  audience: ${AUTH0_AUDIENCE:https://dev-8nsu386inyln7qfs.us.auth0.com/api/v2/}
  database-connection: ${AUTH0_DATABASE_CONNECTION:Username-Password-Authentication}

  roles:
    system-user: ${AUTH0_ROLE_SYSTEM_USER:rol_HhD7jrh3qJjAJV4q}

github:
  token: ${GITHUB_TOKEN:}
  api-url: ${GITHUB_API_URL:https://api.github.com}